version: "3.9"

# Movie / TV Downloader — single-container deployment.
# Ein Container, ein exponierter Port, alles inklusive (Scraping, Queue,
# ffmpeg, Frontend). Keine Sidecars, kein Redis, kein FlareSolverr.
#
# Image on Docker Hub:  daseric/movie-tv-downloader

name: movie-tv-downloader

services:
  downloader:
    # When you've published the image to Docker Hub, Compose will pull it.
    # If you want to build locally instead, keep the `build:` block —
    # Compose uses `build` when the image isn't present locally.
    image: daseric/movie-tv-downloader:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-tv-downloader
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HOMELAB_CREDIT: ${HOMELAB_CREDIT:-true}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-de}
      CONCURRENCY: ${CONCURRENCY:-1}
      HOSTER_PRIORITY: ${HOSTER_PRIORITY:-VOE,Vidmoly,Vidoza,Doodstream}
      QUALITY_PROFILE: ${QUALITY_PROFILE:-best}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Discord bot — first-boot bootstrap. Once saved via the UI the
      # SQLite settings store takes precedence over these env vars.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      DISCORD_UPLOAD_CHANNEL_ID: ${DISCORD_UPLOAD_CHANNEL_ID:-}
      DISCORD_REQUEST_ROLE_ID: ${DISCORD_REQUEST_ROLE_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      PROXY_URL: ${PROXY_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${MOVIES_PATH:-./data/movies}:/movies
      - ${TV_PATH:-./data/tv}:/tv
      - ${CONFIG_PATH:-./data/config}:/config
      - ${TMP_PATH:-./data/tmp}:/tmp/h0melab
